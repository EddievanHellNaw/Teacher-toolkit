<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Students List</h1>
    <table>
    <thead>
        <tr>
            <th>Student ID</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Email</th>
            <th>Group</th>
        </tr>
    </thead>

    <tbody>
        {% for student in students %}
            <tr>
                <td>{{ student.student_id }}</td>
                <td>{{ student.first_name }}</td>
                <td>{{ student.last_name }}</td>
                <td>{{ student.email }}</td>
                <td>{{ student.group }}</td>
                <td><a href="{% url 'student_detail' student.id %}">View Details</a></td>
            </tr>
        {% empty %}
            <tr>
                <td colspan="5">No students registered yet.</td>
            </tr>
        {% endfor %}
    </tbody>
</table>
    <a href="{% url 'student_create' %}">Add New Student</a>
</body>
</html>
